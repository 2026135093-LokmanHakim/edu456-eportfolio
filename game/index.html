<style>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ---------- language ---------- */
let lang = "ms";
const T = p => (typeof p === "string" ? p : p[lang === "ms" ? 0 : 1]);
const UI = {
  back:["Portfolio","Portfolio"], title:["Studio Batik Pelangi","Batik Pelangi Studio"],
  help:["Bantuan","Help"], hint:["Jalan dengan anak panah atau WASD, atau ketik lantai. Tekan E di stesen.","Walk with the arrow keys or WASD, or tap the floor. Press E at a station."],
  play:["Main","Play"], locked:["Selesaikan stesen sebelum ini dahulu.","Finish the previous station first."],
  close:["Tutup","Close"], check:["Semak","Check"], retry:["Cuba lagi","Try again"],
  helpText:["Jalan di sepanjang lorong dengan anak panah, WASD, joystick atau ketik lantai. Dekati setiap stesen dan tekan E atau butang Main. Tali penghadang terbuka selepas stesen siap. Di hujung lorong, jawab soalan di pintu. Tiga bintang ialah markah terbaik.","Walk along the corridor with the arrow keys, WASD, the joystick or by tapping the floor. Go up to each station and press E or the Play button. A rope barrier opens when the station is done. At the end of the corridor, answer the questions at the door. Three stars is the best score."],
  allOk:["Betul semua. Stesen siap.","All correct. Station complete."], someBad:["Ada yang belum tepat. Cuba lagi.","Some are not right yet. Try again."]
};

/* ---------- content ---------- */
const ST = [
  {id:"rack", node:"hs_rack", ch:["Pengenalan","Introduction"], name:["Rak kain","Fabric rack"]},
  {id:"map", node:"hs_map", ch:["Asal-usul","Origins"], name:["Peta asal-usul","Origins map"]},
  {id:"motif", node:"hs_motif", ch:["Motif","Motifs"], name:["Dinding motif","Motif wall"]},

  {id:"table", node:"hs_table", ch:["Proses","Process"], name:["Meja proses","Process table"]},
  {id:"door", node:"hs_door", ch:["Rumusan","Summary"], name:["Pintu","Door"]}
];
const SETS = {
  rack:{
    intro:["Tandakan cara setiap batik menghalang warna.","Mark how each batik blocks the dye."],
    opts:[["w",["Lilin","Wax"]],["t",["Ikatan","Ties"]]],
    rows:[{q:["Batik canting","Canting batik"],a:"w"},{q:["Batik blok (cap)","Block (cap) batik"],a:"w"},{q:["Batik skrin","Screen batik"],a:"w"},{q:["Batik Pelangi","Batik Pelangi"],a:"t"}]},
  map:{
    intro:["Jawab berdasarkan buku teks dan catatan sejarah dalam flipbook.","Answer from the textbook and the historical notes in the flipbook."],
    rows:[
      {q:["Dikaitkan dengan penghasilan awal kain pelangi di Terengganu","Associated with early kain pelangi production in Terengganu"],a:"m",opts:[["m",["Minah Pelangi","Minah Pelangi"]],["c",["Haji Che Su","Haji Che Su"]]]},
      {q:["Menyumbang kepada perusahaan batik dan cetakan blok di Kelantan","Contributed to the batik enterprise and block printing in Kelantan"],a:"c",opts:[["m",["Minah Pelangi","Minah Pelangi"]],["c",["Haji Che Su","Haji Che Su"]]]},
      {q:["\"Batik ialah satu-satunya pakaian kebangsaan Malaysia.\"","\"Batik is the only national attire of Malaysia.\""],a:"f",opts:[["b",["Benar","True"]],["f",["Palsu","False"]]]}]},
  motif:{
    intro:["Padankan setiap motif dengan kategorinya.","Match each motif with its category."],
    opts:[["fl",["Flora","Flora"]],["fa",["Fauna","Fauna"]],["ge",["Geometri","Geometric"]],["ab",["Abstrak","Abstract"]]],
    rows:[{q:["Pucuk rebung","Pucuk rebung (bamboo shoot)"],a:"fl"},{q:["Kupu-kupu","Butterfly"],a:"fa"},{q:["Kawung","Kawung"],a:"ge"},{q:["Mega mendung (awan hujan)","Mega mendung (rain clouds)"],a:"ab"}]}
};
const TOOLS = [
  [["Tali atau benang","String or thread"],1],[["Getah","Rubber bands"],1],[["Guli","Marbles"],1],[["Berus","Brush"],1],
  [["Pewarna Remazol","Remazol dye"],1],[["Sodium silikat","Sodium silicate"],1],[["Sarung tangan","Gloves"],1],[["Cermin mata keselamatan","Safety glasses"],1],
  [["Lilin cair","Molten wax"],0],[["Canting","Canting tool"],0],[["Blok logam","Metal block"],0]
];
const STEPS = [["Ikat kain","Tie the cloth"],["Sediakan pewarna","Prepare the dye"],["Celup kain","Dye the cloth"],["Tambah warna","Add colour"],["Buka ikatan","Untie the cloth"],["Matikan warna (sodium silikat)","Fix the colour (sodium silicate)"],["Cuci","Wash"],["Keringkan di tempat teduh","Dry in a shady place"]];
const SHUF = [3,6,0,5,2,7,1,4];
const DYES = [["#e24b4a","Merah","Red"],["#f08c00","Jingga","Orange"],["#fcc419","Kuning","Yellow"],["#2f9e44","Hijau","Green"],["#1c7ed6","Biru","Blue"],["#7048e8","Ungu","Purple"]];
const QUIZ = [
  {q:["Apakah fungsi lilin dalam batik?","What does wax do in batik?"],o:[["Menghalang warna daripada meresap","It blocks the dye from soaking in"],["Menambah warna pada kain","It adds colour to the cloth"],["Mengeringkan kain","It dries the cloth"],["Menguatkan benang","It strengthens the thread"]],a:0},
  {q:["Batik Pelangi dihasilkan dengan teknik apa?","Which technique makes Batik Pelangi?"],o:[["Canting berlilin","Wax canting"],["Ikat celup tanpa lilin","Tie-dye without wax"],["Cap blok logam","Metal block stamping"],["Skrin saring sutera","Silk screen"]],a:1},
  {q:["Tempoh rendaman sodium silikat sebenar mesti mengikut apa?","What must the real sodium silicate soaking time follow?"],o:[["Agak-agak sahaja","A rough guess"],["Panduan pengilang pewarna dan arahan guru","The dye maker's guidance and the teacher"],["Pendapat kawan","A friend's opinion"],["Lebih lama lebih baik","The longer the better"]],a:1}
];

/* ---------- state ---------- */
const S = {done:{}, mistakes:0, cur:null, sel:{}, checked:{}, tools:new Set(), toolsChecked:false, order:[], colors:[], clothMade:false, quiz:0, quizMsg:"", cloth:null, finished:false};
const $ = s => document.querySelector(s), panel = $("#panel");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- three.js ---------- */
const canvas = $("#c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2140);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 80);
scene.fog = new THREE.Fog(0x2a2140, 26, 70);
const hemi = new THREE.HemisphereLight(0xfff4e0, 0x6b5a8e, 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(6, 10, 8); scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, {left:-9, right:9, top:9, bottom:-9, near:1, far:40});
const spot = new THREE.SpotLight(0xfff0d0, 0, 14, 0.55, 0.6, 1); scene.add(spot); scene.add(spot.target);
let focusCam = null;
const SXS = {rack:5.5, map:11.5, motif:17.5, tools:23.5, table:29.5, door:34.6}, GATES = [8.5, 14.5, 20.5, 26.5, 32.5];
const H = {obj:null, x:1.5, z:0.8, face:0.3, phase:0, parts:{}};
const gates = [], nodes = {}, stationMeshes = {};
let doorPivot = null, doorTarget = 0, clothSlot = null, goal = null, near = null;
const camPos = new THREE.Vector3(-3, 6, 9), camLook = new THREE.Vector3(4, 1, 0);
function size(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", size); size();

/* framed posters from the flipbook art, hung on the back wall between stations */
const POSTERS = [[2.6, "poster-start"], [8.5, "poster-types"], [14.5, "poster-motif"], [20.5, "poster-tools"], [26.5, "poster-steps1"], [32.5, "poster-steps2"]];
function addPosters(){
  const tl = new THREE.TextureLoader();
  POSTERS.forEach(([x, name]) => {
    const g = new THREE.Group(), w = 1.42, h = 2.0;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.16, h + 0.16, 0.06), new THREE.MeshStandardMaterial({color:0x6b4f2e, roughness:0.8}));
    const tex = tl.load("../assets/game/art/" + name + ".webp"); tex.colorSpace = THREE.SRGBColorSpace;
    const pic = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({map:tex, roughness:0.9}));
    pic.position.z = 0.035; frame.castShadow = true; g.add(frame, pic); g.position.set(x, 1.65, -2.86); scene.add(g);
  });
}

/* hero: Quaternius Universal Base Characters + Universal Animation Library (CC0), dressed in vertex colours */
const CLOTH = {shirt:0x1d9e75, sleeve:0xd4537e, pants:0x2b3a67, shoes:0xf4efff};
function dressHero(mesh){
  const geo = mesh.geometry, si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight, bones = mesh.skeleton.bones, n = si.count, arr = new Float32Array(n * 4);
  const cls = bones.map(b => { const k = b.name.toLowerCase();
    if (/upperarm/.test(k)) return "sleeve"; if (/spine|clavicle/.test(k)) return "shirt";
    if (/pelvis|thigh|calf/.test(k)) return "pants"; if (/foot|ball/.test(k)) return "shoes"; return null; });
  const col = {}; for (const k in CLOTH) col[k] = new THREE.Color(CLOTH[k]);
  for (let v = 0; v < n; v++){
    const w = {shirt:0, sleeve:0, pants:0, shoes:0}; let tot = 0;
    for (let j = 0; j < 4; j++){ const c = cls[[si.getX(v), si.getY(v), si.getZ(v), si.getW(v)][j]], wt = [sw.getX(v), sw.getY(v), sw.getZ(v), sw.getW(v)][j]; if (c){ w[c] += wt; tot += wt; } }
    let r = 0, g = 0, b = 0; if (tot > 0) for (const k in w){ r += col[k].r * w[k] / tot; g += col[k].g * w[k] / tot; b += col[k].b * w[k] / tot; }
    arr.set([r, g, b, Math.min(1, Math.max(0, (tot - 0.4) * 3))], v * 4);
  }
  geo.setAttribute("clothC", new THREE.BufferAttribute(arr, 4));
  const m = mesh.material = mesh.material.clone();
  m.onBeforeCompile = sh => {
    sh.vertexShader = "attribute vec4 clothC; varying vec4 vCloth;\n" + sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\nvCloth = clothC;");
    sh.fragmentShader = "varying vec4 vCloth;\n" + sh.fragmentShader.replace("#include <map_fragment>", "#include <map_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, vCloth.rgb, vCloth.a);");
  };
}
function loadHero(){
  const L = new GLTFLoader();
  Promise.all([L.loadAsync("../assets/game/hero.glb"), L.loadAsync("../assets/game/hero-anims.glb")]).then(([c, a]) => {
    const body = []; c.scene.traverse(o => { if (o.isSkinnedMesh) body.push(o); });
    body.sort((p, q) => q.geometry.attributes.position.count - p.geometry.attributes.position.count);
    if (body[0]) dressHero(body[0]);
    c.scene.traverse(o => { if (o.isMesh){ o.frustumCulled = false; o.castShadow = true; } });
    const grp = new THREE.Group(); grp.add(c.scene); scene.add(grp);
    if (H.obj) H.obj.visible = false;
    H.obj = grp; H.mixer = new THREE.AnimationMixer(c.scene); H.acts = {};
    a.animations.forEach(cl => { H.acts[cl.name] = H.mixer.clipAction(cl); });
    H.acts.Interact.setLoop(THREE.LoopOnce); H.acts.Interact.clampWhenFinished = false;
    H.cur = "Idle_Loop"; H.acts.Idle_Loop.play();
  }).catch(e => console.error("hero load failed", e));
}
H.play = (name, fade = 0.2) => {
  if (!H.acts || H.cur === name || !H.acts[name]) return;
  const nx = H.acts[name], pv = H.acts[H.cur]; nx.reset().fadeIn(fade).play(); if (pv) pv.fadeOut(fade); H.cur = name;
};
new GLTFLoader().load("../assets/game/corridor.glb", g => {
  scene.add(g.scene); loadHero(); addPosters();
  g.scene.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  ST.forEach(s => {
    const n = g.scene.getObjectByName(s.node); nodes[s.id] = n; stationMeshes[s.id] = [];
    n.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.userData.st = s.id; stationMeshes[s.id].push(o); } });
  });
  GATES.forEach((_, i) => gates.push(g.scene.getObjectByName("gate_" + (i + 1))));
  doorPivot = g.scene.getObjectByName("door_pivot");
  clothSlot = g.scene.getObjectByName("cloth_slot");
  if (clothSlot){ clothSlot.material = clothSlot.material.clone(); clothSlot.material.side = THREE.DoubleSide; }
  H.obj = g.scene.getObjectByName("hero");
  ["legL", "legR", "armL", "armR"].forEach(n => H.parts[n] = g.scene.getObjectByName(n));
  $("#load").remove(); refresh(); say(U("hint"), 6000);
}, undefined, () => { $("#load").textContent = "Gagal memuatkan model 3D / Could not load the 3D model"; });

let sayT = 0;
function say(msg, ms){ const h = $("#hint"); h.textContent = msg; h.style.display = "block"; clearTimeout(sayT); if (ms) sayT = setTimeout(() => h.style.display = "none", ms); }

/* movement */
const keys = {}, joy = {x:0, y:0};
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(); if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  keys[k] = true;
  if ((k === "e" || k === "enter" || k === " ") && near && !S.cur) openStation(near);
  if (k === "escape" && S.cur) closePanel();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
function limitX(){ for (let i = 0; i < GATES.length; i++) if (!S.done[ST[i].id]) return GATES[i] - 0.75; return 35.6; }
function walkTo(id){
  const x = SXS[id]; goal = {x:Math.min(x, limitX()), z:0.7, station:id};
  if (x > limitX() + 0.1) say(U("locked"), 3000);
}

/* picking: tap a station to walk to it, tap the floor to walk there */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), floor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let down = null;
canvas.addEventListener("pointerdown", e => { down = {x:e.clientX, y:e.clientY}; window.focus(); });
addEventListener("load", () => window.focus());
canvas.addEventListener("pointerup", e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 8 || S.cur) return;
  const r = canvas.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(Object.values(stationMeshes).flat(), false)[0];
  if (hit){ walkTo(hit.object.userData.st); return; }
  const p = new THREE.Vector3(); if (ray.ray.intersectPlane(floor, p)){ goal = {x:p.x, z:p.z, station:null}; if (p.x > limitX() + 0.3) say(U("locked"), 2500); }
});
/* joystick */
const joyEl = $("#joy"), knob = joyEl.querySelector("i"); let joyId = null;
function joyMove(e){
  const r = joyEl.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), m = Math.min(1, Math.hypot(dx, dy) / 40), a = Math.atan2(dy, dx);
  joy.x = Math.cos(a) * m; joy.y = Math.sin(a) * m; knob.style.transform = "translate(" + joy.x * 34 + "px," + joy.y * 34 + "px)";
}
joyEl.addEventListener("pointerdown", e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
joyEl.addEventListener("pointermove", e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId === joyId){ joyId = null; joy.x = joy.y = 0; knob.style.transform = ""; } };
joyEl.addEventListener("pointerup", joyEnd); joyEl.addEventListener("pointercancel", joyEnd);
$("#prompt").addEventListener("click", () => { if (near && !S.cur) openStation(near); });

/* cloth texture from the player's three colours */
function makeCloth(cols){
  const N = 512, c = document.createElement("canvas"); c.width = c.height = N;
  const x = c.getContext("2d"), im = x.createImageData(N, N);
  const rgb = cols.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
  const sectors = rgb.length * 2;
  for (let py = 0; py < N; py++) for (let px = 0; px < N; px++){
    const dx = px - N / 2, dy = py - N / 2, r = Math.hypot(dx, dy) / (N / 2);
    let a = Math.atan2(dy, dx) / (Math.PI * 2) + 0.5, t = (a + r * 0.9) % 1, seg = t * sectors, i = Math.floor(seg), f = seg - i;
    const base = rgb[i % rgb.length];
    let w = f < 0.07 ? (0.07 - f) / 0.07 : f > 0.93 ? (f - 0.93) / 0.07 : 0; w = Math.min(1, w * 0.65 + (r < 0.06 ? 0.7 : 0));
    const n = (Math.random() - 0.5) * 16, o = (py * N + px) * 4;
    for (let k = 0; k < 3; k++) im.data[o + k] = Math.max(0, Math.min(255, base[k] * (1 - w) + 250 * w + n));
    im.data[o + 3] = 255;
  }
  x.putImageData(im, 0, 0); S.cloth = c;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  if (clothSlot){ clothSlot.material.map = tex; clothSlot.material.color.setHex(0xffffff); clothSlot.material.needsUpdate = true; }
}

/* ---------- UI ---------- */
function stars(){ return S.mistakes <= 2 ? 3 : S.mistakes <= 6 ? 2 : 1; }
function refresh(){
  $("#stations").innerHTML = ST.map((s, i) => `<button class="chip ${S.done[s.id] ? "done" : ""} ${S.cur === s.id ? "on" : ""}" data-a="open" data-id="${s.id}">${i + 1}. ${esc(T(s.name))}${S.done[s.id] ? " ✓" : ""}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T(UI[e.dataset.t]));
  $("#bLang").textContent = lang === "ms" ? "English" : "Bahasa Melayu";
  document.documentElement.lang = lang === "ms" ? "ms" : "en";
  if (S.cur) render();
}
function openStation(id){
  if (id === "door" && !ST.slice(0, 5).every(s => S.done[s.id]) && !S.done.door){ S.cur = id; setFocus(id); panelShow(lockedHTML()); refresh(); return; }
  S.cur = id; goal = null; H.busy = performance.now() + 1500; H.play("Interact", 0.15); setFocus(id); render(); refresh();
}
function setFocus(id){
  const n = nodes[id]; if (!n) return;
  const c = new THREE.Box3().setFromObject(n).getCenter(new THREE.Vector3()), por = camera.aspect < 0.85;
  if (id === "door") focusCam = {pos:new THREE.Vector3(c.x - 4.6, 1.9, 1.2), look:new THREE.Vector3(c.x, 1.3, -0.1)};
  else focusCam = {pos:new THREE.Vector3(c.x - (por ? 0 : 0.3), Math.max(1.7, c.y + 0.5), c.z + (por ? 5.6 : 4.2)), look:new THREE.Vector3(c.x + (por ? 0 : 1.3), Math.max(0.7, c.y * 0.9 - (por ? 0.9 : 0)), c.z)};
  spot.position.set(c.x, 3.2, c.z + 3); spot.target.position.copy(c);
}
function closePanel(){ S.cur = null; panel.style.display = "none"; refresh(); }
function panelShow(html){ panel.style.display = "block"; panel.innerHTML = `<button class="btn x" data-a="close">${U("close")}</button>${html}`; }
function head(id){ const s = ST.find(x => x.id === id); return `<div class="kick">${esc(T(s.ch))}</div><h2>${esc(T(s.name))}</h2>`; }
function lockedHTML(){
  const left = ST.slice(0, 5).filter(s => !S.done[s.id]).map(s => T(s.name));
  return head("door") + `<p>${lang === "ms" ? "Pintu masih terkunci. Siapkan dahulu: " : "The door is still locked. Finish these first: "}${esc(left.join(", "))}.</p>`;
}
function render(){
  const id = S.cur; if (!id) return;
  if (id === "door") return panelShow(S.done.door ? endHTML() : S.quiz >= 0 && ST.slice(0, 5).every(s => S.done[s.id]) ? quizHTML() : lockedHTML());
  if (SETS[id]) return panelShow(setHTML(id));
  if (id === "tools") return panelShow(toolsHTML());
  if (id === "table") return panelShow(tableHTML());
}
function setHTML(id){
  const set = SETS[id], sel = S.sel[id] || (S.sel[id] = {}), chk = S.checked[id];
  let h = head(id) + `<p>${esc(T(set.intro))}</p>`;
  set.rows.forEach((r, i) => {
    const opts = r.opts || set.opts;
    h += `<div class="row"><div class="q">${esc(T(r.q))}</div>` + opts.map(([v, lab]) => {
      let cl = sel[i] === v ? "sel" : ""; if (chk && sel[i] === v) cl = sel[i] === r.a ? "ok" : "bad";
      return `<button class="chip ${cl}" data-a="pick" data-s="${id}" data-i="${i}" data-v="${v}">${esc(T(lab))}</button> `;
    }).join("") + `</div>`;
  });
  return h + (S.done[id] ? `<div class="msg ok">${U("allOk")}</div>` : `<div class="msg ${chk ? "bad" : ""}">${chk ? U("someBad") : ""}</div><button class="btn pri" data-a="check" data-s="${id}">${U("check")}</button>`);
}
function toolsHTML(){
  let h = head("tools") + `<p>${lang === "ms" ? "Pilih semua alat dan bahan yang diperlukan untuk Batik Pelangi, termasuk perlindungan diri. Jangan pilih yang bukan miliknya." : "Pick every tool and material needed for Batik Pelangi, including protection. Leave out the ones that do not belong."}</p><div class="row">`;
  TOOLS.forEach(([n, need], i) => {
    const on = S.tools.has(i); let cl = on ? "sel" : ""; if (S.toolsChecked && on) cl = need ? "ok" : "bad";
    h += `<button class="chip ${cl}" data-a="tool" data-i="${i}" style="margin:3px 4px 3px 0">${esc(T(n))}</button>`;
  });
  h += `</div>`;
  return h + (S.done.tools ? `<div class="msg ok">${U("allOk")}</div>` : `<div class="msg ${S.toolsChecked ? "bad" : ""}">${S.toolsChecked ? U("someBad") : ""}</div><button class="btn pri" data-a="checkTools">${U("check")}</button>`);
}
function tableHTML(){
  let h = head("table");
  if (S.done.table) return h + `<div class="msg ok">${lang === "ms" ? "Kain pelangi anda sudah tergantung di tali ampaian." : "Your rainbow cloth is now hanging on the drying line."}</div><p class="note">${lang === "ms" ? "Ini contoh ilustratif teknik ikat celup moden, bukan gambaran sejarah Batik Pelangi tradisional." : "This is an illustrative example of modern tie-dye, not a historical depiction of traditional Batik Pelangi."}</p>`;
  if (S.order.length < 8){
    h += `<p>${lang === "ms" ? "Susun 8 langkah mengikut urutan. Langkah ke-" + (S.order.length + 1) + " ialah?" : "Put the 8 steps in order. What is step " + (S.order.length + 1) + "?"}</p>`;
    SHUF.forEach(s => { const u = S.order.includes(s); h += `<button class="chip ${u ? "ok" : ""}" ${u ? "disabled" : `data-a="step" data-s="${s}"`} style="margin:3px 4px 3px 0">${u ? S.order.indexOf(s) + 1 + ". " : ""}${esc(T(STEPS[s]))}</button>`; });
    return h + `<div class="msg ${S.stepBad ? "bad" : ""}">${S.stepBad ? (lang === "ms" ? "Salah urutan. Cuba langkah lain." : "Wrong order. Try another step.") : ""}</div>`;
  }
  h += `<p>${lang === "ms" ? "Langkah siap. Pilih 3 warna pewarna untuk kain anda, kemudian celup." : "Steps done. Pick 3 dye colours for your cloth, then dip it."}</p><div class="row">`;
  DYES.forEach((d, i) => { const on = S.colors.includes(i); h += `<button class="chip ${on ? "sel" : ""}" data-a="dye" data-i="${i}" style="margin:3px 4px 3px 0"><span class="sw" style="background:${d[0]}"></span>${esc(lang === "ms" ? d[1] : d[2])}</button>`; });
  h += `</div><p class="note">${lang === "ms" ? "Keselamatan: kerja di bawah pengawasan guru, pakai sarung tangan dan cermin mata keselamatan, dan di tempat berudara baik." : "Safety: work under teacher supervision, wear gloves and safety glasses, and use a well-ventilated area."}</p>`;
  return h + `<button class="btn pri" data-a="dip" ${S.colors.length === 3 ? "" : "disabled"}>${lang === "ms" ? "Celup kain" : "Dip the cloth"}</button>`;
}
function quizHTML(){
  const q = QUIZ[S.quiz];
  return head("door") + `<p>${lang === "ms" ? "Soalan" : "Question"} ${S.quiz + 1} / ${QUIZ.length}</p><div class="row"><div class="q">${esc(T(q.q))}</div>` +
    q.o.map((o, i) => `<div style="margin:4px 0"><button class="chip ${S.quizPick === i ? "bad" : ""}" data-a="ans" data-i="${i}">${"ABCD"[i]}. ${esc(T(o))}</button></div>`).join("") + `</div><div class="msg ${S.quizPick != null ? "bad" : ""}">${S.quizPick != null ? (lang === "ms" ? "Bukan itu. Cuba lagi." : "Not that one. Try again.") : ""}</div>`;
}
function endHTML(){
  const n = stars();
  return head("door") + `<div class="stars" aria-label="${n} / 3">${"★".repeat(n)}${"☆".repeat(3 - n)}</div><p>${lang === "ms" ? "Pintu terbuka. Anda menyelesaikan studio dengan " + S.mistakes + " kesilapan." : "The door is open. You finished the studio with " + S.mistakes + " mistake(s)."}</p>` +
    `<button class="btn pri" data-a="dl">${lang === "ms" ? "Muat turun kain saya" : "Download my cloth"}</button> <button class="btn" data-a="again">${lang === "ms" ? "Main semula" : "Play again"}</button>` +
    `<p class="note">${lang === "ms" ? "Kandungan berdasarkan Pendidikan Seni Visual Tingkatan 5 KSSM (2020), Tajuk 6: Seni Batik. Watak dan animasi: Quaternius (CC0)." : "Content based on Pendidikan Seni Visual Tingkatan 5 KSSM (2020), Topic 6: Seni Batik. Character and animations: Quaternius (CC0)."}</p>`;
}

const ACT = {
  open: d => { if (near === d.id && !S.cur) openStation(d.id); else walkTo(d.id); }, close: () => closePanel(),
  pick: d => { const s = S.sel[d.s] || (S.sel[d.s] = {}); s[d.i] = d.v; S.checked[d.s] = false; render(); },
  check: d => {
    const set = SETS[d.s], sel = S.sel[d.s] || {}; let bad = 0;
    set.rows.forEach((r, i) => { if (sel[i] !== r.a) bad++; });
    S.checked[d.s] = true; if (bad){ S.mistakes += bad; } else { S.done[d.s] = true; celebrate(d.s); }
    render(); refresh();
  },
  tool: d => { const i = +d.i; S.tools.has(i) ? S.tools.delete(i) : S.tools.add(i); S.toolsChecked = false; render(); },
  checkTools: () => {
    let bad = 0; TOOLS.forEach(([, need], i) => { if (!!need !== S.tools.has(i)) bad++; });
    S.toolsChecked = true; if (bad) S.mistakes += bad; else { S.done.tools = true; celebrate("tools"); }
    render(); refresh();
  },
  step: d => { const s = +d.s; if (s === S.order.length){ S.order.push(s); S.stepBad = false; } else { S.stepBad = true; S.mistakes++; } render(); },
  dye: d => { const i = +d.i, k = S.colors.indexOf(i); if (k > -1) S.colors.splice(k, 1); else if (S.colors.length < 3) S.colors.push(i); render(); },
  dip: () => { makeCloth(S.colors.map(i => DYES[i][0])); S.done.table = true; render(); refresh(); celebrate("table"); },
  ans: d => {
    if (+d.i === QUIZ[S.quiz].a){ S.quizPick = null; S.quiz++; if (S.quiz >= QUIZ.length){ S.done.door = true; doorTarget = -1.7; } }
    else { S.quizPick = +d.i; S.mistakes++; }
    render(); refresh();
  },
  dl: () => {
    const c = document.createElement("canvas"); c.width = 640; c.height = 760; const x = c.getContext("2d");
    x.fillStyle = "#faf6ee"; x.fillRect(0, 0, 640, 760);
    if (S.cloth) x.drawImage(S.cloth, 40, 40, 560, 560);
    x.fillStyle = "#2b1b3d"; x.font = "600 30px Manrope,sans-serif"; x.fillText(lang === "ms" ? "Kain Pelangi Saya" : "My Rainbow Cloth", 40, 650);
    x.font = "400 18px Manrope,sans-serif"; x.fillStyle = "#6b5a80"; x.fillText("Studio Batik Pelangi · EDU456 · Lokman Hakim bin Yusoff", 40, 690);
    x.fillStyle = "#facc15"; x.font = "30px sans-serif"; x.fillText("★".repeat(stars()) + "☆".repeat(3 - stars()), 40, 730);
    const a = document.createElement("a"); a.download = "kain-pelangi-saya.png"; a.href = c.toDataURL("image/png"); a.click();
  },
  again: () => { location.reload(); }
};
function celebrate(id){ stationMeshes[id]?.forEach(m => m.material.color.offsetHSL(0, 0.08, 0.06)); const i = ST.findIndex(s => s.id === id); if (i < GATES.length) say(lang === "ms" ? "Tali penghadang dibuka. Teruskan ke stesen seterusnya." : "The rope barrier is open. Move on to the next station.", 4000); }
document.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (b && ACT[b.dataset.a]) ACT[b.dataset.a](b.dataset); });
$("#bLang").addEventListener("click", () => { lang = lang === "ms" ? "en" : "ms"; refresh(); });
$("#bHelp").addEventListener("click", () => { S.cur = null; panelShow(`<h2>${U("help")}</h2><p>${U("helpText")}</p>`); });

/* loop */
let last = performance.now();
function tick(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (H.obj){
    const ix = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0) + joy.x;
    const iz = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0) + joy.y;
    let mx = 0, mz = 0;
    if (!S.cur){
      if (Math.abs(ix) + Math.abs(iz) > 0.12){ goal = null; const m = Math.hypot(ix, iz); mx = ix / Math.max(1, m); mz = iz / Math.max(1, m); }
      else if (goal){
        const dx = goal.x - H.x, dz = goal.z - H.z, d = Math.hypot(dx, dz);
        if (d < 0.12){ const st = goal.station; goal = null; if (st) openStation(st); } else { mx = dx / d; mz = dz / d; }
      }
    }
    const sp = 2.8, nx = Math.max(0.8, Math.min(limitX(), H.x + mx * sp * dt)), nz = Math.max(-1.4, Math.min(2.3, H.z + mz * sp * dt));
    const moved = Math.hypot(nx - H.x, nz - H.z) > 1e-4;
    if (goal && (mx || mz) && !moved) goal = null;
    H.x = nx; H.z = nz;
    if (moved){ const tf = Math.atan2(mx, mz); let df = tf - H.face; df = Math.atan2(Math.sin(df), Math.cos(df)); H.face += df * Math.min(1, dt * 12); H.phase += dt * 10; }
    else H.phase *= 0.8;
    const sw = moved ? Math.sin(H.phase) : H.phase * 0;
    H.obj.position.set(H.x, moved && !H.mixer ? Math.abs(Math.sin(H.phase)) * 0.04 : 0, H.z); H.obj.rotation.y = H.face;
    if (H.mixer){ if (H.acts.Walk_Loop) H.acts.Walk_Loop.timeScale = 1.35; H.play(moved ? "Walk_Loop" : (now < H.busy ? H.cur : (S.done.door ? "Dance_Loop" : "Idle_Loop"))); H.mixer.update(dt); }
    const P = H.parts;
    if (P.legL){ P.legL.rotation.x = sw * 0.7; P.legR.rotation.x = -sw * 0.7; P.armL.rotation.x = -sw * 0.6; P.armR.rotation.x = sw * 0.6; }
    let n = null; for (const s of ST) if (Math.abs(H.x - SXS[s.id]) < 2.0) n = s.id;
    const pb = $("#prompt");
    if (n !== near){ near = n; }
    if (near && !S.cur){ pb.style.display = "block"; pb.textContent = U("play") + ": " + T(ST.find(s => s.id === near).name) + "  [E]"; } else pb.style.display = "none";
  }
  gates.forEach((g, i) => { if (g){ const t = S.done[ST[i].id] ? -1.5 : 0; g.position.y += (t - g.position.y) * 0.08; } });
  if (doorPivot) doorPivot.rotation.y += (doorTarget - doorPivot.rotation.y) * 0.06;
  const zoom = camera.aspect < 0.85 ? 1.45 : 1;
  const tp = new THREE.Vector3(H.x + (camera.aspect < 0.85 ? 0.4 : 2.4), 1.0, 0.2), cp = new THREE.Vector3(H.x - 3.2 * zoom, 5.6 * zoom, 8.6 * zoom);
  const zoomIn = S.cur && focusCam;
  camPos.lerp(zoomIn ? focusCam.pos : cp, Math.min(1, dt * (zoomIn ? 3 : 4))); camLook.lerp(zoomIn ? focusCam.look : tp, Math.min(1, dt * (zoomIn ? 3 : 4)));
  spot.intensity += ((zoomIn ? 14 : 0) - spot.intensity) * Math.min(1, dt * 4); hemi.intensity += ((zoomIn ? 0.8 : 1.2) - hemi.intensity) * Math.min(1, dt * 4);
  sun.position.set(H.x + 6, 10, 8); sun.target.position.set(H.x, 0, 0);
  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
refresh(); requestAnimationFrame(tick);
window.__game = {S, ACT, openStation, H, walkTo};
</script>
